services:
  postgres:
    image: postgres:16-alpine
    container_name: truck_check_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: truck_check
      POSTGRES_USER: truck_user
      POSTGRES_PASSWORD: truck_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: truck_check_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
