services:
  - type: web
    name: truck-check-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: truck-check-db
          property: connectionString
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: truck-check-web
          property: host
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: AUTH_TOKEN_SECRET
        generateValue: true

  - type: web
    name: truck-check-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://truck-check-api.onrender.com; connect-src 'self' https://truck-check-api.onrender.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
      - path: /*
        name: X-Frame-Options
        value: "DENY"
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"
      - path: /*
        name: Referrer-Policy
        value: "no-referrer"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=63072000; includeSubDomains"
      - path: /*
        name: Permissions-Policy
        value: "camera=(self), microphone=(), geolocation=()"
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: truck-check-api
          property: host

databases:
  - name: truck-check-db
    plan: free
    region: oregon
    databaseName: truck_check
    user: truck_user
    postgresMajorVersion: 16
